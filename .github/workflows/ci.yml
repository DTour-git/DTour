name: CI

# Compile and integration checks for every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build only needs these to exist; it never talks to Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Typecheck (shared, web, mobile)
        run: npm run typecheck --workspaces --if-present

      - name: Lint web
        run: npx eslint .
        working-directory: apps/web
      - name: Lint mobile
        run: npx expo lint
        working-directory: apps/mobile

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npx next build
        working-directory: apps/web

  # Each runner gets its own Supabase database and uses only local credentials.
  dev-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Start local Supabase
        shell: bash
        run: |
          npm exec --yes --package=supabase@3.1.0 -- supabase start \
            --exclude imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >/dev/null
          npm exec --yes --package=supabase@3.1.0 -- supabase status --output json | jq -er '
            select(.API_URL | startswith("http://127.0.0.1:"))
            | select(.DB_URL | test("@127\\.0\\.0\\.1:[0-9]+/"))
            | select(.PUBLISHABLE_KEY and .SERVICE_ROLE_KEY)
            | "DEV_SUPABASE_URL=\(.API_URL)",
              "DEV_SUPABASE_PUBLISHABLE_KEY=\(.PUBLISHABLE_KEY)",
              "DEV_SUPABASE_SECRET_KEY=\(.SERVICE_ROLE_KEY)",
              "DEV_DB_URL=\(.DB_URL)"
          ' >> "$GITHUB_ENV"

      - name: Database tests (pgTAP)
        run: npm run test:db

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser tests (Playwright)
        run: npm run test:e2e
      # On CI the reporters are `github` + `list`, so failures leave traces in test-results/ (no HTML report).
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
