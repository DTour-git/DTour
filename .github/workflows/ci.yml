name: CI

# Compile checks for every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build only needs these to exist; it never talks to Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Typecheck (shared, web, mobile)
        run: npm run typecheck --workspaces --if-present

      - name: Lint web
        run: npx eslint .
        working-directory: apps/web
      - name: Lint mobile
        run: npx expo lint
        working-directory: apps/mobile

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npx next build
        working-directory: apps/web

  # Database (pgTAP) and browser (Playwright) tests against the DEV Supabase project.
  # Needs the DEV_* repository secrets; skipped when they are missing (e.g. forks).
  dev-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    # One run at a time: all runs share the same dev database.
    concurrency:
      group: dev-db
      cancel-in-progress: false
    env:
      DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      DEV_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
      DEV_SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
      DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
      HAS_DEV: ${{ secrets.DEV_DB_URL != '' }}
    steps:
      - if: env.HAS_DEV != 'true'
        run: echo "::notice::DEV_* secrets not set — skipping database and browser tests."
      - if: env.HAS_DEV == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_DEV == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: env.HAS_DEV == 'true'
        run: npm ci

      - name: Database tests (pgTAP)
        if: env.HAS_DEV == 'true'
        run: npm run test:db

      - name: Install Chromium
        if: env.HAS_DEV == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser tests (Playwright)
        if: env.HAS_DEV == 'true'
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure() && env.HAS_DEV == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
